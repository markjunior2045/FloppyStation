[workspace]
members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Marcos Galvao"]

[workspace.dependencies]
floppy-station-core = { path = "core" }
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
